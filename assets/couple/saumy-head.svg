  <path d="M128 76c44 0 72 30 72 80c0 46-30 76-72 76s-72-30-72-76c0-50 28-80 72-80z" fill="#C98B5E"/>
  <path d="M66 176c8 34 32 56 62 56s54-22 62-56c-10 22-32 38-62 38s-52-16-62-38z" fill="#B07448" opacity=".55"/>
