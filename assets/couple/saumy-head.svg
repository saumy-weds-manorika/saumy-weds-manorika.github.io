  <g fill="#FCE9D6"><circle cx="112" cy="104" r="2.6"/><circle cx="120" cy="108" r="2.6"/><circle cx="128" cy="110" r="2.6"/><circle cx="136" cy="108" r="2.6"/><circle cx="144" cy="104" r="2.6"/></g>
