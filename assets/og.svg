<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Saumy &amp; Manorika · Shaadi Express to Bhilwara</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Mukta:wght@600&amp;family=Yatra+One&amp;display=block');
    .disp { font-family: 'Yatra One', 'Mukta', sans-serif; }
    .body { font-family: 'Mukta', system-ui, sans-serif; font-weight: 600; }
    .dm { font-family: 'DotGothic16', 'Courier New', monospace; letter-spacing: .08em; }
  </style>
  <defs>
    <pattern id="bandhani" width="36" height="36" patternUnits="userSpaceOnUse">
      <g fill="#FCE9D6" fill-opacity=".17"><circle cx="9" cy="5.8" r="1.15"/><circle cx="12.2" cy="9" r="1.15"/><circle cx="9" cy="12.2" r="1.15"/><circle cx="5.8" cy="9" r="1.15"/></g>
      <circle cx="9" cy="9" r=".9" fill="#FFD23F" fill-opacity=".26"/>
      <g fill="#F6A609" fill-opacity=".15"><circle cx="27" cy="23.8" r="1.15"/><circle cx="30.2" cy="27" r="1.15"/><circle cx="27" cy="30.2" r="1.15"/><circle cx="23.8" cy="27" r="1.15"/></g>
