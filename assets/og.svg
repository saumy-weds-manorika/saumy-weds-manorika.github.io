    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#303C96" stop-opacity=".6"/><stop offset="1" stop-color="#303C96" stop-opacity="0"/></radialGradient>
