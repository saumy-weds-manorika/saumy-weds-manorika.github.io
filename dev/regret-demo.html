<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regret dodge demo</title>
<style>
  :root {
    --neel: #1A2260; --neel-deep: #10164A; --genda: #F6A609; --genda-deep: #E07B00;
    --rani: #D6246E; --haldi: #FFD23F; --kagaz: #FCE9D6; --syahi: #1B1B2F;
    --patta: #2F7D32; --sindoor: #C62828;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--neel) radial-gradient(circle, rgba(252,233,214,.12) 1.5px, transparent 2px) 0 0 / 18px 18px;
    color: var(--kagaz);
    font: 16px/1.45 Mukta, system-ui, sans-serif;
    overflow-x: hidden;
  }
  .bar {
    position: sticky; z-index: 50; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 16px; background: var(--neel-deep); color: var(--kagaz);
  }
  #hdr { top: 0; height: 64px; border-bottom: 3px solid var(--genda); }
  #ftr { bottom: 0; height: 76px; border-top: 3px solid var(--genda); padding-bottom: env(safe-area-inset-bottom); }
  .bar strong { font-size: 15px; }
  .cta {
    min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px;
    background: var(--genda); color: var(--syahi); font: 600 16px Mukta, system-ui, sans-serif;
  }
  /* The transform proves the moved chip escapes ancestor transforms. */
  main { max-width: 480px; margin: 0 auto; padding: 16px; transform: translateZ(0); }
  .card { background: var(--kagaz); color: var(--syahi); border-radius: 14px; padding: 14px; margin: 0 0 16px; }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .status { margin: 8px 0 0; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--syahi);
    background: transparent; color: var(--syahi); font: 600 15px Mukta, system-ui, sans-serif; cursor: pointer;
  }
  .chip[aria-checked="true"] { background: var(--rani); border-color: var(--rani); color: #fff; }
  .chip:focus-visible, .cta:focus-visible, button:focus-visible { outline: 3px solid var(--haldi); outline-offset: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 16px; }
  .controls label { display: inline-flex; gap: 8px; align-items: center; min-height: 44px; }
  .controls button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--kagaz); background: transparent; color: var(--kagaz); font: inherit; }
  .filler { height: 1100px; border: 2px dashed rgba(252,233,214,.35); border-radius: 14px; padding: 16px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #log { font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; margin: 0 0 16px; }
</style>
</head>
<body>
<header class="bar" id="hdr"><strong>Fake journey bar (64px)</strong><span id="count">dodges: 0</span></header>
<main>
  <p>Tap a Regret chip. It should dodge 3 times (page-wide), then select on the 4th tap. After that every Regret selects immediately.
     Cards use event delegation on <code>#cards</code> (add <code>?direct=1</code> for direct listeners).</p>
  <div class="controls">
    <button type="button" id="reset">Reset controller</button>
    <label><input type="checkbox" id="rm"> Reduced motion</label>
  </div>
  <div id="cards"></div>
  <pre id="log" aria-hidden="true"></pre>
  <div class="filler">Filler so the page scrolls.</div>
</main>
<footer class="bar" id="ftr"><strong>Fake CTA (76px)</strong><button type="button" class="cta">Next station →</button></footer>
<div id="live" class="sr-only" aria-live="polite"></div>

<script type="module">
  // Cache-busted so the demo always tests the file on disk (python http.server sends no cache headers).
  const { createRegretController } = await import(`../js/regret.js?v=${Date.now()}`);

  const direct = new URLSearchParams(location.search).has('direct');
  const people = ['Rahul Sharma', 'Priya Sharma', 'Kabir Khan'];
  const statuses = people.map(() => null);
  const live = document.getElementById('live');
  const logEl = document.getElementById('log');
  const rmBox = document.getElementById('rm');
  const hdr = document.getElementById('hdr');
  const ftr = document.getElementById('ftr');

  const log = (msg) => {
    console.log(msg);
    logEl.textContent = `${msg}\n${logEl.textContent}`.slice(0, 1200);
    document.getElementById('count').textContent = `dodges: ${regret.dodges}`;
  };

  const regret = createRegretController({
    messages: ['Do you not love Saumy?', 'How could you miss a Marwadi wedding?', 'You must be completely anti-fun person!!'],
    finalMessage: 'Okay, okay, you must be really busy at the time. We will try to understand. 😢',
    announce: (t) => { live.textContent = ''; requestAnimationFrame(() => { live.textContent = t; }); },
    getInsets: () => ({
      top: Math.max(0, hdr.getBoundingClientRect().bottom),
      bottom: Math.max(0, window.innerHeight - ftr.getBoundingClientRect().top),
    }),
    reducedMotion: () => rmBox.checked,
  });
  window.rj = regret;
  window.demo = { statuses };

  const cards = document.getElementById('cards');
  cards.innerHTML = people.map((name, i) => `
    <section class="card" data-i="${i}">
      <h2>${name}</h2>
      <div class="chips" role="radiogroup" aria-label="Status for ${name}">
        <button type="button" class="chip" role="radio" aria-checked="false" data-status="confirmed">Confirmed</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-status="waitlisted">Waitlisted</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-status="regret">Regret</button>
      </div>
      <p class="status" data-out>Status: none</p>
    </section>`).join('');

  function setStatus(i, s) {
    statuses[i] = s;
    const card = cards.querySelector(`[data-i="${i}"]`);
    card.querySelectorAll('[data-status]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.status === s)));
    card.querySelector('[data-out]').textContent = `Status: ${s}`;
    log(`guest ${i} -> ${s} (dodges=${regret.dodges})`);
  }

  function onChip(btn, i) {
    const s = btn.dataset.status;
    if (s === 'regret') {
      const r = regret.handle(btn, () => setStatus(i, 'regret'));
      log(`regret.handle on guest ${i}: ${r} (dodges=${regret.dodges})`);
    } else {
      setStatus(i, s);
    }
  }

  if (direct) {
    cards.querySelectorAll('.card').forEach((card) => {
      const i = Number(card.dataset.i);
      card.querySelectorAll('[data-status]').forEach((btn) => btn.addEventListener('click', () => onChip(btn, i)));
    });
  } else {
    cards.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-status]');
      if (!btn) return;
      onChip(btn, Number(btn.closest('.card').dataset.i));
    });
  }

  document.getElementById('reset').addEventListener('click', () => {
    regret.reset();
    log('reset');
  });
  // With delegated listeners, taps on the moved chip reach regret.js's own fallback (not onChip),
  // so poll the counter to keep the header and console in sync.
  let lastDodges = 0;
  setInterval(() => {
    if (regret.dodges !== lastDodges) {
      lastDodges = regret.dodges;
      console.log(`dodges = ${lastDodges}`);
      document.getElementById('count').textContent = `dodges: ${lastDodges}`;
    }
  }, 150);
  log(`ready (${direct ? 'direct' : 'delegated'} listeners)`);
</script>
</body>
</html>
